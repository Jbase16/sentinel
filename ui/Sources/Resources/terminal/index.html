<!doctype html>
<html>
  <head>
    <link rel="stylesheet" href="xterm-5.3.0.css" />
    <script src="xterm-5.3.0.js"></script>
    <script src="xterm-addon-fit-0.8.0.js"></script>
    <style>
      body { margin: 0; padding: 0; background: #1e1e1e; height: 100vh; overflow: hidden; }
      #terminal { width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <div id="terminal"></div>
    <script>
      const term = new Terminal({
        theme: { background: '#1e1e1e' },
        fontFamily: 'Menlo, Monaco, "Courier New", monospace',
        fontSize: 14,
        cursorBlink: true
      });
      const fitAddon = new FitAddon.FitAddon();
      term.loadAddon(fitAddon);
      term.open(document.getElementById('terminal'));
      fitAddon.fit();

      // Bridge: Send input to Swift.
      term.onData(data => {
        window.webkit.messageHandlers.pty.postMessage({type: 'input', data: data});
      });

      window.addEventListener('resize', () => {
        clearTimeout(window.resizeTimer);
        window.resizeTimer = setTimeout(() => {
          fitAddon.fit();
          window.webkit.messageHandlers.pty.postMessage({
            type: 'resize', cols: term.cols, rows: term.rows
          });
        }, 100);
      });

      // Bridge: Receive output from Swift.
      window.receiveOutput = function(text) { term.write(text); };
      window.webkit.messageHandlers.pty.postMessage({type: 'ready'});
    </script>
  </body>
</html>
